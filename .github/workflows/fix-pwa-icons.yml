name: Fix PWA icons

on:
  push:
    branches: [main]
    paths:
      - 'tools/fix_icons.py'
      - 'icon-source.svg'
      - '.github/workflows/fix-pwa-icons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cairosvg
      - run: python tools/fix_icons.py
      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apple-touch-icon-fixed.png icon-192-fixed.png icon-512-fixed.png
          git diff --cached --quiet || git commit -m "Generate iOS-safe PWA icons"
          git push
